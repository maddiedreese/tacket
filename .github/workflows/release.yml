name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require signed tag release credentials
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          missing=()
          for name in \
            DEVELOPER_ID_APPLICATION \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Signed tag releases require missing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Verify source
        run: npm run verify
      - name: Package extension and app
        run: |
          bash scripts/package-extension.sh
          bash scripts/package-mac-dev.sh
      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > developer-id.p12
          security import developer-id.p12 \
            -k build.keychain \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain
      - name: Sign app
        if: env.DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        run: bash scripts/sign-mac-app.sh
      - name: Package DMG
        run: bash scripts/package-dmg.sh
      - name: Notarize DMG
        if: env.DEVELOPER_ID_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        run: bash scripts/notarize-dmg.sh
      - name: Checksums and release verification
        run: |
          npm run generate:checksums
          npm run verify:release
      - uses: actions/upload-artifact@v7
        with:
          name: tacket-release
          path: |
            dist/Tacket.dmg
            dist/tacket-chrome-extension.zip
            dist/SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Tacket.dmg \
            dist/tacket-chrome-extension.zip \
            dist/SHA256SUMS \
            --title "Tacket ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for release notes. Verify downloads with SHA256SUMS."
